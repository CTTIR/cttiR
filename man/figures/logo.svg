<svg width="500" height="580" viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgctti" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"  stop-color="#141210"/>
      <stop offset="100%" stop-color="#070605"/>
    </linearGradient>
    <clipPath id="hexctti">
      <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"/>
    </clipPath>
  </defs>

  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145" fill="url(#bgctti)"/>

  <g clip-path="url(#hexctti)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- SCAFFOLD GRID — the project structure cttiR generates    -->
    <!-- Four quadrants divided by cross-lines, bronze accent     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- quadrant divider cross -->
    <line x1="250" y1="168" x2="250" y2="372" stroke="#5C4A2A" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="270" x2="360" y2="270" stroke="#5C4A2A" stroke-width="2" opacity="0.6"/>
    <!-- outer frame of the scaffold -->
    <rect x="140" y="168" width="220" height="204" rx="6" fill="none"
      stroke="#3a3326" stroke-width="1.6" opacity="0.7"/>

    <!-- faint registry tick marks inside quadrants (data registry / plan) -->
    <g stroke="#3a3326" stroke-width="1" opacity="0.4">
      <line x1="160" y1="300" x2="222" y2="300"/>
      <line x1="160" y1="315" x2="210" y2="315"/>
      <line x1="160" y1="330" x2="222" y2="330"/>
      <line x1="278" y1="300" x2="340" y2="300"/>
      <line x1="278" y1="315" x2="328" y2="315"/>
      <line x1="278" y1="330" x2="340" y2="330"/>
      <line x1="160" y1="198" x2="222" y2="198"/>
      <line x1="278" y1="198" x2="340" y2="198"/>
    </g>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- CTIR QUADRANT LETTERING — the group brandmark            -->
    <!-- C / T top, I / R bottom, white, with bronze T shadow     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- bronze shadow behind T (signature from the brandmark) -->
    <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="74"
      fill="#5C4A2A" text-anchor="middle" x="311" y="247" opacity="0.9">T</text>

    <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="74"
      fill="#FFFFFF" text-anchor="middle" x="195" y="245">C</text>
    <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="74"
      fill="#FFFFFF" text-anchor="middle" x="306" y="245">T</text>
    <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="74"
      fill="#FFFFFF" text-anchor="middle" x="195" y="352">I</text>
    <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="74"
      fill="#FFFFFF" text-anchor="middle" x="306" y="352">R</text>

    <!-- scaffold annotation -->
    <text font-family="monospace" font-size="8" fill="#9A7B3A" opacity="0.6"
      text-anchor="middle" x="250" y="408">project · scaffold</text>

  </g>

  <!-- Hex border — CTIR bronze/gold (identity / meta package) -->
  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"
    fill="none" stroke="#9A7B3A" stroke-width="11" stroke-linejoin="round"/>
  <polygon points="250,44 441,153 441,367 250,476 59,367 59,153"
    fill="none" stroke="#C8A24E" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>

  <!-- Package name -->
  <text font-family="monospace" font-weight="700" font-size="27"
    fill="#E8D5A8" text-anchor="middle" x="250" y="545" letter-spacing="1">cttiR</text>
</svg>
